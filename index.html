<body>
    <div class="app-container">
        <header>
            <h1>2026年05月份假期场地使用</h1>

        <main>
            <div class="venue-selector" id="venueSelector">

                    <tbody id="scheduleBody">
                        <!-- Table rows will be injected here -->
                    </tbody>
                </table>
            </div>
